name: publish

# A session pushes a branch upload/<utc-timestamp>-<n> holding incoming/ (see tools/publish_store.py in
# jkrek17/marine-research):
#   incoming/{basin}/{YYYYMMDDHH}.zip                                 model fields
#   incoming/truth/{analysis,obs,airsea,gridsat,airmass}/{basin}/{YYYYMMDDHH}.npz truth, one file per valid time
#   incoming/truth/{ascat,smap}/{YYYYMMDD}.npz                        truth, one file per day
# scripts/upload_incoming.sh turns each into a release asset (fields-{basin}-{YYYYMM}, truth-{kind}[-{basin}]-{YYYYMM}),
# then this workflow deletes the branch.
on:
  push:
    branches: ['upload/**']

permissions:
  contents: write

# Queue runs; never cancel one mid-upload. GitHub keeps only the newest *pending* run, so each run
# handles every upload/* branch that exists when it gets to run (a skipped run's branch is picked up
# by the next one).
concurrency:
  group: publish-releases
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Upload incoming files to releases and delete the branches
        shell: bash
        run: |
          set -euo pipefail
          # the upload script from main, so an older upload branch (cut before the script existed) still works
          cp scripts/upload_incoming.sh "$RUNNER_TEMP/upload_incoming.sh"
          git fetch --no-tags origin '+refs/heads/upload/*:refs/remotes/origin/upload/*' || true
          branches=$(git for-each-ref --format='%(refname:strip=3)' 'refs/remotes/origin/upload/*' | sort)
          echo "triggered by: ${GITHUB_REF_NAME:-?}; branches to process: ${branches:-none}"
          for b in $branches; do
            echo "::group::$b"
            git checkout -q --detach "origin/$b"
            bash "$RUNNER_TEMP/upload_incoming.sh" incoming
            git checkout -q --detach origin/main
            git push origin --delete "$b"
            echo "::endgroup::"
          done
