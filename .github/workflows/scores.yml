name: scores

# Mondays at 06:00 UTC, re-run every study's standing-score preset (studies/*/preset.py in the kit, through
# tools/run_presets.py) over the whole store, 2025-11-01 to the most recent Sunday at least 3 days back (ASCAT
# lags about 2 days), and publish standing_scores.csv, drift_flags.csv, preset_status.csv and scores_meta.json
# as assets of the release `scores` (replacing the previous ones). Reads come from the releases of this
# repository (fields-*, truth-*), nothing is written to them. The kit (jkrek17/marine-research) must be public:
# it is cloned without a token.
#
# 06:00 UTC is clear of the marine wind page build windows (02:15, 08:15, 14:15, 20:15 for an hour).
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      start:
        description: 'First cycle day, YYYYMMDD (default: 20251101)'
        required: false
        default: ''
      end:
        description: 'Last cycle day, YYYYMMDD (default: the most recent Sunday at least 3 days back)'
        required: false
        default: ''
      kit_ref:
        description: 'Branch or tag of jkrek17/marine-research to run (default: main)'
        required: false
        default: 'main'

permissions:
  contents: write

# Two scores runs never overlap, and a running one is never cancelled. It reads the store only, so it does not
# share the ecmwf-pull group with fill and truth.
concurrency:
  group: scores
  cancel-in-progress: false

jobs:
  scores:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GIT_TERMINAL_PROMPT: '0'
      INPUT_START: ${{ inputs.start }}
      INPUT_END: ${{ inputs.end }}
      KIT_REF: ${{ inputs.kit_ref || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: data
      - name: Clone the kit (public, no token)
        run: |
          if ! git ls-remote --exit-code https://github.com/jkrek17/marine-research.git HEAD >/dev/null 2>&1; then
            echo "::error title=marine-research is not public yet::jkrek17/marine-research cannot be read without a token. Make it public (design decision 1a) before this job can run."
            exit 1
          fi
          git clone --quiet --depth 1 --branch "$KIT_REF" https://github.com/jkrek17/marine-research.git kit
          git -C kit log -1 --format='kit %H %s'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the kit's requirements
        run: |
          if ! git ls-remote --exit-code https://github.com/jkrek17/awips-tools.git HEAD >/dev/null 2>&1; then
            echo "::error title=awips-tools is not public::kit/requirements.txt installs nwp from jkrek17/awips-tools, which cannot be read without a token."
            exit 1
          fi
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r kit/requirements.txt
          python -c "import nwp, pandas; print('pandas', pandas.__version__)"
      - name: Run the standing-score presets
        id: run
        timeout-minutes: 105
        run: |
          set -uo pipefail
          # RK_DATA and RK_CACHE are writable scratch folders: the warning preset writes under RK_DATA at
          # import, and rk.store / rk.truth unpack release assets into RK_CACHE.
          export RK_CACHE="$RUNNER_TEMP/rk-cache" RK_DATA="$RUNNER_TEMP/rk-data"
          mkdir -p "$RK_CACHE" "$RK_DATA"
          START="${INPUT_START:-20251101}"
          if [ -n "$INPUT_END" ]; then
            END="$INPUT_END"
          else
            # most recent Sunday at least 3 days back (%u: Monday 1 .. Sunday 7)
            back3=$(date -u -d '3 days ago' +%Y-%m-%d)
            END=$(date -u -d "$back3 - $(( $(date -u -d "$back3" +%u) % 7 )) days" +%Y%m%d)
          fi
          for v in "$START" "$END"; do
            [[ "$v" =~ ^[0-9]{8}$ ]] && date -u -d "$v" >/dev/null 2>&1 \
              || { echo "::error::bad date '$v' (want YYYYMMDD)"; exit 1; }
          done
          S="${START:0:4}-${START:4:2}-${START:6:2}"
          E="${END:0:4}-${END:4:2}-${END:6:2}"
          echo "range $S .. $E"
          echo "start=$S" >> "$GITHUB_OUTPUT"
          echo "end=$E" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/scores"
          # exit 1 means a preset failed; the CSVs that were written are still published, then the job fails
          python kit/tools/run_presets.py --start "$S" --end "$E" --out-dir "$RUNNER_TEMP/scores"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "run_presets exit code $rc"
          exit 0
      - name: Publish to the scores release
        if: ${{ !cancelled() }}
        env:
          START: ${{ steps.run.outputs.start }}
          END: ${{ steps.run.outputs.end }}
          RC: ${{ steps.run.outputs.rc }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/scores"
          mkdir -p "$out"
          KIT_SHA=$(git -C kit rev-parse HEAD)
          export OUT="$out" KIT_SHA KIT_REF START END RC
          python3 - <<'PY'
          import csv, datetime as dt, json, os
          out = os.environ["OUT"]
          presets = {}
          try:
              with open(os.path.join(out, "preset_status.csv"), newline="") as f:
                  for r in csv.DictReader(f):
                      presets[r["study"]] = r["status"]
          except FileNotFoundError:
              pass
          rc = os.environ.get("RC", "")
          meta = {
              "generated_utc": dt.datetime.now(dt.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "kit_repo": "jkrek17/marine-research",
              "kit_ref": os.environ["KIT_REF"],
              "kit_sha": os.environ["KIT_SHA"],
              "start": os.environ.get("START") or None,
              "end": os.environ.get("END") or None,
              "run_presets_exit": int(rc) if rc.isdigit() else None,
              "presets": presets,
          }
          with open(os.path.join(out, "scores_meta.json"), "w") as f:
              json.dump(meta, f, indent=2)
              f.write("\n")
          PY
          cat "$out/scores_meta.json"
          files=()
          for n in standing_scores.csv drift_flags.csv preset_status.csv scores_meta.json; do
            [ -f "$out/$n" ] && files+=("$out/$n") || echo "::warning::$n was not written"
          done
          if ! gh release view scores >/dev/null 2>&1; then
            gh release create scores --target main --latest=false \
              --title "Standing scores" \
              --notes "Weekly standing scores of the kit's study presets (standing_scores.csv, drift_flags.csv, preset_status.csv, scores_meta.json). Replaced every Monday by the scores workflow. See README.md." \
              || gh release view scores >/dev/null   # lost a race with another job: fine
          fi
          # replace the previous assets: --clobber overwrites by name; anything else left over is deleted
          keep=" ${files[*]##*/} "
          for old in $(gh release view scores --json assets --jq '.assets[].name'); do
            case "$keep" in *" $old "*) ;; *) gh release delete-asset scores "$old" --yes ;; esac
          done
          for i in 1 2 3; do
            gh release upload scores "${files[@]}" --clobber && break
            echo "attempt $i failed" >&2
            [ "$i" = 3 ] && exit 1
            sleep 20
          done
          echo "uploaded ${#files[@]} asset(s) to the scores release"
      - name: Fail if a preset failed
        if: ${{ !cancelled() && steps.run.outputs.rc != '0' }}
        run: |
          echo "::error title=A preset failed::run_presets exited ${{ steps.run.outputs.rc || 'without a code (the step did not finish)' }}; the CSVs that were written are published. See preset_status.csv."
          exit 1
